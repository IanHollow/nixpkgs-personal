title = "nixpkgs-personal Gitleaks configuration"

[[allowlists]]
description = "Spotify CDN signed download URLs are public, short-lived artifact URLs generated by SpotX."
paths = ['''^pkgs/by-name/sp/spotify-spotx/source\.nix$''']
regexes = [
  '''https://upgrade\.scdn\.co/upgrade/client/osx-arm64/spotify-autoupdate-[^"]+\.tbz\?fauth=[A-Za-z0-9._-]+''',
]
